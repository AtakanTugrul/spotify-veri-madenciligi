name: Testler

on:
  push:
    branches: [main]
  pull_request:

# İş akışı yalnızca kodu okur; repoya yazma izni yok
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Bir sürüm başarısız olsa da diğerleri sonuna kadar çalışsın.
      # 3.11 canlı demonun sürümü; 3.12 ve 3.13, 3.11 desteği bitince geçiş için.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Testleri çalıştır
        run: pytest -q
